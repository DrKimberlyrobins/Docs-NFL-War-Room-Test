name: Update NFL player game logs
on:
  push:
    branches:
      - player-probability-upgrade-20261019
    paths:
      - ".github/workflows/update-player-game-logs.yml"
      - "scripts/build_player_game_logs.py"
      - "scripts/backtest_player_props.py"
      - "scripts/run-backtest-trigger.txt"
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 2"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest model against prior weeks
        run: python scripts/backtest_player_props.py
      - name: Commit verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-game-logs-2026.json data/player-model-audit-2026.json
          git diff --cached --quiet || (git commit -m "Update verified NFL weekly player logs" && git push)
