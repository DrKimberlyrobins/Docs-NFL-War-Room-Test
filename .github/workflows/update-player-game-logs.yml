name: Update NFL player game logs
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 2"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build player game logs
        run: python scripts/build_player_game_logs.py
      - name: Commit verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-game-logs-2026.json
          git diff --cached --quiet || (git commit -m "Update verified NFL weekly player logs" && git push)
