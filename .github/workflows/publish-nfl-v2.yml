name: Publish trained V2 NFL probabilities
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install nflreadpy pandas pyarrow numpy scikit-learn joblib
      - name: Restore last verified trained V2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model-output
          gh run download 39154397462 --repo "${{ github.repository }}" --name nfl-trained-model-and-results --dir model-output
          test -f model-output/nfl_win_model.joblib
      - name: Generate current eight-day probabilities
        run: python predict_nfl_games.py --days 8
      - name: Validate and publish results
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('nfl-game-probabilities-2026.json')
          d=json.loads(p.read_text())
          assert d['model']=='pregame_logistic_v2' and d['games_count']==len(d['games']) and d['games']
          for g in d['games']:
              assert abs(g['home_win_probability']+g['away_win_probability']-100)<0.1
          target=pathlib.Path('data/nfl-game-probabilities-2026.json')
          target.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-game-probabilities-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified trained V2 probabilities"
            git push
          fi
