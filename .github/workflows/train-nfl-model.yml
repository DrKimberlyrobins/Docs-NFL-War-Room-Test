
name: Train and Test NFL Model

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install modeling packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scikit-learn joblib

      - name: Download verified historical dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p historical
          gh run download 39138598428 \
            --repo "${{ github.repository }}" \
            --name nfl-history-2020-2025 \
            --dir historical

      - name: Train, calibrate, and test
        run: python train_nfl_model.py

      - name: Audit calibration and sportsbook prices
        run: python audit_nfl_market.py  

      - name: Upload model and test results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-trained-model-and-results
          path: model-output/
          retention-days: 90
